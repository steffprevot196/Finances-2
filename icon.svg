<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </linearGradient>
  </defs>

  <!-- Fond : carré arrondi, fond gradient émeraude (safe zone maskable respectée) -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#shadow)"/>

  <!-- Camembert stylisé (écho au logo header) — centré, dans la safe zone -->
  <g transform="translate(256 256)">
    <!-- Secteur 1 : haut-droite (clair) -->
    <path d="M 0 0 L 0 -140 A 140 140 0 0 1 121 -70 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Secteur 2 : bas-droite -->
    <path d="M 0 0 L 121 -70 A 140 140 0 0 1 121 70 Z" fill="#ffffff" opacity="0.75"/>
    <!-- Secteur 3 : bas-gauche -->
    <path d="M 0 0 L 121 70 A 140 140 0 0 1 -121 70 Z" fill="#ffffff" opacity="0.55"/>
    <!-- Secteur 4 : haut-gauche -->
    <path d="M 0 0 L -121 70 A 140 140 0 0 1 0 -140 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Contour du cercle -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#065f46" stroke-width="6" opacity="0.35"/>
    <!-- Point central -->
    <circle cx="0" cy="0" r="12" fill="#065f46" opacity="0.55"/>
  </g>

  <!-- Tendance croissante en bas (petite courbe discrète) -->
  <g transform="translate(256 400)" opacity="0.85">
    <polyline points="-120,20 -70,5 -20,12 30,-15 80,-30 120,-45"
              fill="none" stroke="#065f46" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="-45" r="10" fill="#065f46"/>
  </g>
</svg>